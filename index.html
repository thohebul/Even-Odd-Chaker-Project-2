<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Boostrap CSS CND -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Even/Odd</title>
</head>

<body>
    <div class="container border rounded shadow mt-5 w-50 mx-auto p-5">
        <div class="row">
            <div class="col">
                <h3 class="text-center mb-3">Even & Odd Cheker</h3>
                <div class="form-group">
                    <div>
                        <input class="form-control" type="number" placeholder="Enter The Number" id="number">
                    </div>
                    <div>
                        <button onclick="dataChaker()" class="btn btn-success mx-auto text-center my-3 btn-md"
                            type="button" id="submit">Press Here</button>
                    </div>
                </div>
                <div id="result" class="card bg-primary text-center text-white mt-3 p-2">
                    <div>
                        <p>See
                            Result here</p>
                    </div>
                </div>
                <div id="danger" class="alert alert-danger" role="alert">
                    Please Enter Number
                </div>
            </div>
        </div>
    </div>
